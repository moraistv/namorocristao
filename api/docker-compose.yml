services:
  postgres:
    image: postgres:16-alpine
    container_name: namoro_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: namoro
      POSTGRES_PASSWORD: namoro
      POSTGRES_DB: namoro_cristao
    ports:
      # Host 5433 -> container 5432 (evita conflito com Postgres local na 5432)
      - "5433:5432"
    volumes:
      - namoro_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: namoro_redis
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  namoro_pg_data:
